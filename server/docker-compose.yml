services:
  server:
    build: .
    container_name: fireflow-server
    ports:
      - "9090:9090"
      - "8443:8443"
    environment:
      - DATABASE_URL=jdbc:postgresql://db:5432/fireflow_db
      - DB_USER=${DB_USER:-fireflow}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - ADMIN_INITIAL_USERNAME=${ADMIN_INITIAL_USERNAME:-admin}
      - ADMIN_INITIAL_PASSWORD=${ADMIN_INITIAL_PASSWORD}
      - SERVER_PORT_SSL=${SERVER_PORT_SSL:-8443}
      - SSL_KEYSTORE=${SSL_KEYSTORE:-}
      - SSL_KEY_ALIAS=${SSL_KEY_ALIAS:-}
      - SSL_KEYSTORE_PASSWORD=${SSL_KEYSTORE_PASSWORD:-}
      - SSL_PRIVATE_KEY_PASSWORD=${SSL_PRIVATE_KEY_PASSWORD:-}
    volumes:
      - ${KEYSTORE_DIR:-./keystore}:/app/keystore:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /app/logs
    mem_limit: 512m
    cpus: 1.0
    networks:
      - fireflow-network

  db:
    image: postgres:16-alpine
    container_name: fireflow-db
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-fireflow_db}
      - POSTGRES_USER=${DB_USER:-fireflow}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fireflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - fireflow-network

volumes:
  pgdata:
    driver: local

networks:
  fireflow-network:
    driver: bridge
