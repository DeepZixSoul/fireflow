services:
  server:
    build: .
    container_name: fireflow-server
    ports:
      - "9090:9090"
    environment:
      - DATABASE_URL=jdbc:postgresql://db:5432/fireflow_db
      - DB_USER=${DB_USER:-fireflow}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /app/logs
    mem_limit: 512m
    cpus: 1.0
    networks:
      - fireflow-network

  db:
    image: postgres:16-alpine
    container_name: fireflow-db
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-fireflow_db}
      - POSTGRES_USER=${DB_USER:-fireflow}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fireflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - fireflow-network

volumes:
  pgdata:
    driver: local

networks:
  fireflow-network:
    driver: bridge
